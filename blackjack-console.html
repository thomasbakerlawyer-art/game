<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackjack console</title>
<style>
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:var(--thumb2)}::-webkit-scrollbar-corner{background:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#detail{display:none}
body.has-sel #detail{display:grid}
body.has-sel #empty{display:none}
body.home #empty{display:none}
body.home.has-sel #users{display:none}
body:not(.home) #back{display:none}
#detail>.dhead{grid-area:head}#kpis{grid-area:kpis}#hero{grid-area:hero}#charts{grid-area:charts}.logbox{grid-area:log}.histbox{grid-area:hist}.statsbox{grid-area:stats}
.dhead{display:flex;align-items:center;gap:16px}
.dhead h1{margin:0}
.chart{height:var(--ch,160px);min-width:0}.chart svg{width:100%;height:100%;display:block}
.log{height:var(--lh,260px);overflow:auto;font-size:13px;line-height:1.8}
.ln .k{display:inline-block;width:5ch;margin-right:10px}
.ln.info .k{color:var(--acc)}.ln.sys .k{color:var(--dim)}.ln.ok .k{color:var(--win)}.ln.bad .k{color:var(--lose)}.ln.warn .k{color:#d9a400}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}.kv b{font-weight:600}
h4{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--dim)}
.empty,.emptymsg{color:var(--dim);padding:18px 4px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-weight:500;color:var(--dim);text-align:left;padding:2px 8px 9px 0}td{padding:7px 8px 7px 0;border-top:1px solid var(--line)}td.w{color:var(--win)}td.l{color:var(--lose)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555}.dot.on{background:var(--win)}
#charts{display:grid;gap:18px}
.pn{min-width:0}
.us.pl,#ustat.pl{color:var(--win)}


:root{color-scheme:dark;--bg:#0a0608;--panel:#140c10;--line:#2c1c23;--text:#ecdfcf;--dim:#9a8a86;--acc:#d9ae3f;--win:#4ade80;--lose:#ff5a6e;--thumb:#3b2a30;--thumb2:#5a3f48;--grid:rgba(255,255,255,.07);--font:Georgia,'Times New Roman',serif;--lh:300px}
#top{display:flex;align-items:center;height:62px;padding:0 30px;border-bottom:1px solid var(--line);font-size:20px;letter-spacing:7px;text-transform:uppercase;color:var(--acc)}
.grow{flex:1}
#body{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 63px)}
#users{border-right:1px solid var(--line);padding:16px 0;background:#0d0709}
.u{display:grid;grid-template-columns:38px 1fr;grid-template-areas:'av un' 'av ub';gap:0 12px;width:100%;text-align:left;padding:12px 22px;border-left:3px solid transparent}
.u:hover{background:#130b0f}.u.on{background:#1a0f14;border-left-color:var(--acc)}
.av{grid-area:av;width:38px;height:38px;border-radius:50%;border:1px solid var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:17px}
.un{grid-area:un;font-size:18px;align-self:end}.ub{grid-area:ub;color:var(--acc);font-size:13px}.us,.ux{display:none}
main{padding:26px 34px 50px}
#detail{grid-template-columns:1.5fr 1fr;grid-template-areas:'head head' 'hero kpis' 'charts charts' 'log hist' 'stats stats';gap:22px}
.dhead h1{font-size:34px;font-weight:400;letter-spacing:1px}#ustat{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.pn{border:1px solid var(--line);border-radius:3px;padding:18px 22px;background:var(--panel)}
#kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;align-content:start}
.kpi{border-bottom:1px solid var(--line);padding:10px 2px}.kpi span{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}.kpi b{font-size:28px;font-weight:400;color:#fff}
#charts{grid-template-columns:1fr 1fr}
.cardsec{--cw:64px;display:grid;gap:18px}
.cardsec h5{margin:0 0 8px;font-size:11px;font-weight:400;letter-spacing:4px;text-transform:uppercase;color:var(--acc)}
.hrow{display:flex;align-items:center;min-height:calc(var(--cw)*1.4)}
.hand .card+.card{margin-left:calc(var(--cw)*-.4)}
.dkr{gap:6px;flex-wrap:wrap}.dkr .card+.card{margin-left:0}.dk{--cw:44px}
.hole .cf{outline:2px dashed rgba(217,174,63,.95);outline-offset:3px}
.next .cf{box-shadow:0 0 0 2px var(--acc)}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border:1px dashed rgba(217,174,63,.28);border-radius:5px;margin-right:6px}
#back{display:none}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);flex:none}
.card+.card{margin-left:calc(var(--cw)*-.58)}
.card .in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.down .in{transform:rotateY(180deg)}
.cf,.cb{position:absolute;inset:0;border-radius:calc(var(--cw)*.08);-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 6px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.55)}
.cf{background:linear-gradient(155deg,#fffef9 0%,#f2e8d2 100%);font-family:Georgia,'Times New Roman',serif}
.cf.r{color:#b3122b}.cf.k{color:#17120f}
.cb{transform:rotateY(180deg);background:#5a0f23;border:calc(var(--cw)*.05) solid #f1e6cf}
.cb::before{content:"";position:absolute;inset:calc(var(--cw)*.025);border:1px solid #d9ae3f;border-radius:calc(var(--cw)*.04);background:repeating-linear-gradient(45deg,rgba(217,174,63,.42) 0 1.5px,transparent 1.5px calc(var(--cw)*.09)),repeating-linear-gradient(-45deg,rgba(217,174,63,.42) 0 1.5px,transparent 1.5px calc(var(--cw)*.09))}
.cn{position:absolute;left:calc(var(--cw)*.07);top:calc(var(--cw)*.05);display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:700;font-size:calc(var(--cw)*.23)}
.cn svg{width:calc(var(--cw)*.17);height:calc(var(--cw)*.17);margin-top:calc(var(--cw)*.02);fill:currentColor}
.cn.b{left:auto;top:auto;right:calc(var(--cw)*.07);bottom:calc(var(--cw)*.05);transform:rotate(180deg)}
.pip{position:absolute;width:calc(var(--cw)*.2);height:calc(var(--cw)*.2);transform:translate(-50%,-50%);fill:currentColor}
.pip.f{transform:translate(-50%,-50%) rotate(180deg)}
.big{position:absolute;left:50%;top:50%;width:calc(var(--cw)*.54);height:calc(var(--cw)*.54);transform:translate(-50%,-50%);fill:currentColor}
.face{position:absolute;left:23%;right:23%;top:14%;bottom:14%;border:1.5px solid #c9a24b;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.5);font-weight:700;background:linear-gradient(180deg,rgba(201,162,75,.16),rgba(201,162,75,.04))}
.fs{position:absolute;left:50%;width:calc(var(--cw)*.14);height:calc(var(--cw)*.14);transform:translateX(-50%);fill:currentColor}
.fs.t{top:6%}.fs.b{bottom:6%;transform:translateX(-50%) rotate(180deg)}

</style>
</head>
<body>
<div id="app">
<header id="top"><div id="tt"></div><span class="grow"></span><i class="dot" id="dot"></i></header>
<div id="body">
<aside id="users"></aside>
<main>
<div id="empty" class="emptymsg">Select a user</div>
<div id="detail">
<div class="dhead"><button id="back" type="button">&larr; Users</button><h1 id="uname"></h1><span id="ustat"></span></div>
<section id="kpis"></section>
<section id="hero" class="pn"></section>
<section id="charts"></section>
<section class="pn logbox"><h4>Log</h4><div class="log" id="log"></div></section>
<section class="pn histbox"><h4>History</h4><div id="hist"></div></section>
<section class="pn statsbox"><h4>Session</h4><div id="stats"></div></section>
</div>
</main>
</div>
</div>
<script>
var SUITS={S:'<path d="M50 6C50 6 10 36 10 60C10 74 20 82 31 82C38 82 44 79 47 74C46 84 42 90 34 94L66 94C58 90 54 84 53 74C56 79 62 82 69 82C80 82 90 74 90 60C90 36 50 6 50 6Z"/>',H:'<path d="M50 90C20 64 8 48 8 31C8 17 19 8 31 8C40 8 47 13 50 21C53 13 60 8 69 8C81 8 92 17 92 31C92 48 80 64 50 90Z"/>',D:'<path d="M50 5L89 50L50 95L11 50Z"/>',C:'<circle cx="50" cy="31" r="21"/><circle cx="29" cy="61" r="21"/><circle cx="71" cy="61" r="21"/><path d="M50 54L39 96L61 96Z"/>'};
var PIPS={'2':[[50,20],[50,80]],'3':[[50,20],[50,50],[50,80]],'4':[[30,20],[70,20],[30,80],[70,80]],'5':[[30,20],[70,20],[50,50],[30,80],[70,80]],'6':[[30,20],[70,20],[30,50],[70,50],[30,80],[70,80]],'7':[[30,20],[70,20],[50,35],[30,50],[70,50],[30,80],[70,80]],'8':[[30,20],[70,20],[50,35],[30,50],[70,50],[50,65],[30,80],[70,80]],'9':[[30,20],[70,20],[30,40],[70,40],[50,50],[30,60],[70,60],[30,80],[70,80]],'10':[[30,20],[70,20],[50,30],[30,40],[70,40],[30,60],[70,60],[50,70],[30,80],[70,80]]};
function sv(s,c,st){return '<svg class="'+c+'" viewBox="0 0 100 100" style="'+(st||'')+'">'+SUITS[s]+'</svg>'}
function cardEl(code,down){
  var r=code.slice(0,-1),s=code.slice(-1),red=(s==='H'||s==='D'),h='';
  if(r==='A')h=sv(s,'big');
  else if('JQK'.indexOf(r)>-1)h='<div class="face">'+r+sv(s,'fs t')+sv(s,'fs b')+'</div>';
  else PIPS[r].forEach(function(p){h+=sv(s,'pip'+(p[1]>50?' f':''),'left:'+p[0]+'%;top:'+p[1]+'%')});
  var d=document.createElement('div');d.className='card'+(down?' down':'');
  d.innerHTML='<div class="in"><div class="cf '+(red?'r':'k')+'"><div class="cn"><span>'+r+'</span>'+sv(s,'')+'</div><div class="cn b"><span>'+r+'</span>'+sv(s,'')+'</div>'+h+'</div><div class="cb"></div></div>';
  return d}

var H=(function(){
  function fmt(n){return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function f2(n){return Number(n).toFixed(2)}
  function empty(el){el.innerHTML='<div class="empty" style="padding-top:56px;text-align:center">no data yet</div>'}
  function line(el,data,color){
    var W=520,Ht=170,pl=48,pb=18,pt=8,pr=8;
    if(!data||data.length<2){empty(el);return}
    var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data);if(mx-mn<1e-6){mx=mn+1;mn=mn-1}
    var pad=(mx-mn)*.12;mn-=pad;mx+=pad;
    var iw=W-pl-pr,ih=Ht-pt-pb,pts=data.map(function(v,i){return [pl+i/(data.length-1)*iw,pt+(1-(v-mn)/(mx-mn))*ih]});
    var ln=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
    var area=ln+' L'+pts[pts.length-1][0].toFixed(1)+' '+(Ht-pb)+' L'+pl+' '+(Ht-pb)+' Z';
    var g='';for(var k=0;k<4;k++){var y=pt+k/3*ih,v=mx-k/3*(mx-mn);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--grid)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" style="fill:var(--dim)" font-size="11" text-anchor="end" font-family="monospace">'+Math.round(v)+'</text>'}
    el.innerHTML='<svg viewBox="0 0 '+W+' '+Ht+'" preserveAspectRatio="none">'+g+'<path d="'+area+'" fill="'+color+'" opacity=".12"/><path d="'+ln+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
  }
  function signed(el,vals,pos,neg){
    var W=520,Ht=170,pl=48,pb=18,pt=8,pr=8;
    if(!vals||!vals.length){empty(el);return}
    var m=Math.max.apply(null,vals.map(Math.abs));if(m<1)m=1;
    var iw=W-pl-pr,ih=Ht-pt-pb,zero=pt+ih/2,bw=Math.min(28,iw/vals.length*.7),h='';
    h+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+zero+'" y2="'+zero+'" style="stroke:var(--grid)"/>';
    h+='<text x="'+(pl-6)+'" y="'+(pt+9)+'" style="fill:var(--dim)" font-size="11" text-anchor="end" font-family="monospace">+'+Math.round(m)+'</text><text x="'+(pl-6)+'" y="'+(Ht-pb)+'" style="fill:var(--dim)" font-size="11" text-anchor="end" font-family="monospace">-'+Math.round(m)+'</text>';
    vals.forEach(function(v,i){var x=pl+(i+.5)/vals.length*iw-bw/2,hh=Math.abs(v)/m*(ih/2);h+='<rect x="'+x.toFixed(1)+'" y="'+(v>=0?zero-hh:zero).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,hh).toFixed(1)+'" rx="2" fill="'+(v>=0?pos:neg)+'"/>'});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+Ht+'" preserveAspectRatio="none">'+h+'</svg>';
  }
  /* generic bars: items [{v:0..1 height, c:color}], labels [{f:0..1, t:text}] */
  function bars(el,items,labels){
    var W=520,Ht=170,pl=48,pb=18,pt=8,pr=8;
    if(!items||!items.length){empty(el);return}
    var iw=W-pl-pr,ih=Ht-pt-pb,bw=Math.min(24,iw/items.length*.7),h='';
    (labels||[]).forEach(function(l){var y=pt+ih-l.f*ih;h+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--grid)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" style="fill:var(--dim)" font-size="11" text-anchor="end" font-family="monospace">'+l.t+'</text>'});
    items.forEach(function(it,i){var hh=Math.max(2,it.v*ih),px=pl+(i+.5)/items.length*iw-bw/2;h+='<rect x="'+px.toFixed(1)+'" y="'+(pt+ih-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="2" fill="'+it.c+'" opacity=".92"/>'+(it.tick!=null?'<line x1="'+(px-2).toFixed(1)+'" x2="'+(px+bw+2).toFixed(1)+'" y1="'+(pt+ih-it.tick*ih).toFixed(1)+'" y2="'+(pt+ih-it.tick*ih).toFixed(1)+'" stroke="currentColor" stroke-width="1.5"/>':'')});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+Ht+'" preserveAspectRatio="none">'+h+'</svg>';
  }
  return {fmt:fmt,f2:f2,line:line,signed:signed,bars:bars};
})();

</script>
<script>
function cardsFill(el,list,o){el.innerHTML='';if(!list.length){for(var g=0;g<2;g++){var d=document.createElement('div');d.className='slot';el.appendChild(d)}return}list.forEach(function(c,i){var e=cardEl(c,false);if(o.hole&&i===1)e.classList.add('hole');if(o.next&&i===0)e.classList.add('next');el.appendChild(e)})}
window.CFG={game:'blackjack',key:'bj_demo_v1',store:'bj_demo_v1_s',layout:'sidebar-left',title:'Blackjack',
 status:function(s){return s.phase==='play'?'playing':'idle'},
 summary:function(s){return 'Hand '+(s.round||0)},
 kpis:function(s){var has=s.round>0;return [['Balance',H.fmt(s.balance)],['Bet',has&&s.bet?H.fmt(s.bet):'-'],['Hand',has?s.round:'-'],['Player total',s.pT||'-'],['Dealer total',s.dT||'-'],['Cards in shoe',s.shoe!=null?s.shoe:'-']]},
 hero:function(s,el){
   el.innerHTML='<h4>Table</h4><div class="cardsec"><div><h5>Dealer</h5><div class="hrow hand" id="hd"></div></div><div><h5>Player</h5><div class="hrow hand" id="hp"></div></div><div class="dk"><h5>Deck</h5><div class="hrow dkr" id="hk"></div></div></div>';
   cardsFill(document.getElementById('hd'),s.dealer||[],{hole:s.hole});cardsFill(document.getElementById('hp'),s.player||[],{});cardsFill(document.getElementById('hk'),s.deck||[],{next:true});
 },
 charts:[{title:'Balance by hand',draw:function(s,el){H.line(el,s.bser,'#d9ae3f')}},{title:'Net per hand',draw:function(s,el){H.signed(el,(s.hist||[]).slice().reverse().map(function(x){return x.net}),'#4ade80','#ff5a6e')}}],
 hist:function(s){var hs=s.hist||[];if(!hs.length)return '<div class="empty">no hands yet</div>';var t='<table><tr><th>hand</th><th>bet</th><th>player</th><th>dealer</th><th>result</th><th>net</th></tr>';hs.forEach(function(x){var c=x.net>0?'w':x.net<0?'l':'';t+='<tr><td>'+x.n+'</td><td>'+H.fmt(x.bet)+'</td><td>'+x.pT+'</td><td>'+x.dT+'</td><td class="'+c+'">'+x.res+'</td><td class="'+c+'">'+H.fmt(x.net)+'</td></tr>'});return t+'</table>'},
 stats:function(s){var st=s.stats||{wagered:0,wins:0,losses:0,pushes:0,best:0},n=st.wins+st.losses+st.pushes;return [['Hands played',n],['Wins',st.wins],['Losses',st.losses],['Pushes',st.pushes],['Win rate',n?(st.wins/n*100).toFixed(1)+'%':'-'],['Total wagered',H.fmt(st.wagered)],['Biggest win',H.fmt(st.best)],['Session profit',H.fmt((s.balance||0)-(s.start==null?s.balance:s.start))]]}
};

</script>
<script>
(function(){
  var C=window.CFG,$=function(i){return document.getElementById(i)},H=window.H,states={},selected=null,built=false;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var HOME=['grid','table','list'].indexOf(C.layout)>-1;
  document.body.classList.add('L-'+C.layout);if(HOME)document.body.classList.add('home');
  $('tt').textContent=C.title;
  function usersView(){
    var names=Object.keys(states).sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1}),h='';
    if(C.layout==='table')h+='<div class="uh"><span>User</span><span>Balance</span><span>Status</span><span>Activity</span></div>';
    if(!names.length)h+='<div class="empty">No users yet. Open the game on a phone and enter a name.</div>';
    names.forEach(function(n){
      var s=states[n],st=C.status(s);
      h+='<button class="u'+(n===selected?' on':'')+'" data-n="'+esc(n)+'"><span class="av">'+esc(n.charAt(0).toUpperCase())+'</span><span class="un">'+esc(n)+'</span><span class="ub">'+H.fmt(s.balance||0)+'</span><span class="us '+(st==='playing'?'pl':'')+'">'+st+'</span><span class="ux">'+esc(C.summary(s))+'</span></button>';
    });
    $('users').innerHTML=h;
  }
  function build(){
    if(built)return;built=true;
    var h='';C.charts.forEach(function(c,i){h+='<div class="pn"><h4>'+c.title+'</h4><div class="chart" id="c'+i+'"></div></div>'});
    $('charts').innerHTML=h;
  }
  function logHTML(lg){if(!lg||!lg.length)return '<div class="empty">no activity yet</div>';var h='';lg.forEach(function(e){h+='<div class="ln '+e.l+'"><span class="k">'+e.l+'</span>'+e.m+'</div>'});return h}
  function detail(){
    var s=states[selected];if(!s)return;build();
    $('uname').textContent=selected;$('ustat').textContent=C.status(s);$('ustat').className=C.status(s)==='playing'?'pl':'';
    var k='';C.kpis(s).forEach(function(x){k+='<div class="kpi '+(x[2]||'')+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'});$('kpis').innerHTML=k;
    C.hero(s,$('hero'));
    C.charts.forEach(function(c,i){c.draw(s,$('c'+i))});
    var L=$('log');L.innerHTML=logHTML(s.log);L.scrollTop=L.scrollHeight;
    $('hist').innerHTML=C.hist(s);
    var r='';C.stats(s).forEach(function(x){r+='<div class="kv"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'});$('stats').innerHTML=r;
  }
  function select(n){selected=n;document.body.classList.add('has-sel');usersView();detail();window.scrollTo(0,0)}
  $('users').addEventListener('click',function(e){var b=e.target.closest('.u');if(b)select(b.dataset.n)});
  $('back').addEventListener('click',function(){selected=null;document.body.classList.remove('has-sel');usersView()});
  function onState(s){
    if(!s||!s.user)return;
    var o=states[s.user];if(o&&o.ts&&s.ts&&s.ts<o.ts)return;
    states[s.user]=s;usersView();if(selected===s.user)detail();
  }
  usersView();
  function connect(){
    if(location.protocol.indexOf('http')!==0)return;
    var es=new EventSource('/events/'+C.game);
    es.onopen=function(){$('dot').className='dot on'};
    es.onmessage=function(e){try{onState(JSON.parse(e.data))}catch(x){console.log(x)}};
    es.onerror=function(){$('dot').className='dot';es.close();setTimeout(connect,1500)};
  }
  connect();
  try{var bc=new BroadcastChannel(C.key);bc.onmessage=function(e){onState(e.data)}}catch(e){}
  window.addEventListener('storage',function(e){if(e.key===C.store){try{onState(JSON.parse(e.newValue))}catch(x){}}});
  try{var sv=JSON.parse(localStorage.getItem(C.store));if(sv)onState(sv)}catch(e){}
})();

</script>
</body>
</html>
