<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Coin flip</title>
<style>
:root{color-scheme:light;--bg:#f4efe6;--card:#fffdf8;--line:#e4dccd;--ink:#1b1814;--dim:#7d7365;--win:#2e8b57;--lose:#c2492d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:#cfc4b0 transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cfc4b0;border-radius:8px}::-webkit-scrollbar-corner{background:transparent}
html,body{height:100%;margin:0;background:#e9e2d4}
body{display:flex;justify-content:center;font-family:'Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.app{width:100%;max-width:440px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 6px}
.sk small,.bl small{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:700}
.sk b{display:block;font-size:44px;line-height:1;font-weight:300;font-variant-numeric:tabular-nums}
.bl{text-align:right}
.bl b{display:inline-block;margin-top:4px;padding:7px 16px;border-radius:99px;background:var(--ink);color:#f7f1e4;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.scroll{flex:1;overflow-y:auto;padding:6px 18px 12px;-webkit-overflow-scrolling:touch}
.stage{position:relative;height:250px;display:flex;align-items:center;justify-content:center;perspective:900px}
.hopper{position:relative;width:150px;height:150px}
.hopper.hop{animation:hop 1.3s ease}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-78px) scale(1.12)}100%{transform:translateY(0) scale(1)}}
.cw{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.2,.75,.25,1)}
.face{position:absolute;inset:0;border-radius:50%;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#f9e7ab,#dcae48 55%,#a97c24);box-shadow:inset 0 0 0 8px #c8942f,inset 0 0 0 10px rgba(255,255,255,.3)}
.face b{font-family:Georgia,serif;font-size:72px;font-weight:800;color:#6a4a10}
.face.back{transform:rotateY(180deg)}
.shadow{position:absolute;bottom:26px;left:50%;width:120px;height:18px;margin-left:-60px;border-radius:50%;background:rgba(0,0,0,.14);filter:blur(5px)}
.res{text-align:center;min-height:30px;font-size:20px;font-weight:700}
.res.w{color:var(--win)}.res.l{color:var(--lose)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pick button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 8px;font:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.pick button.on{border-color:var(--ink);background:#fff}
.pick i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f9e7ab,#dcae48 60%,#a97c24);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:800;color:#6a4a10;font-family:Georgia,serif}
.pick button:disabled{opacity:.6}
.hist{display:flex;gap:7px;overflow-x:auto;padding:14px 2px 6px;min-height:50px}
.dotc{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-family:Georgia,serif;border:2px solid var(--lose);color:var(--lose);background:transparent}
.dotc.w{border-color:var(--win);color:var(--win)}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:12px 0 6px;font-weight:700}
.field{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.field:focus-within{border-color:var(--ink)}
.field span{display:flex;align-items:center;padding:0 0 0 14px;color:var(--dim);font-weight:800}
.field input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-size:18px;font-weight:700;padding:13px 10px;outline:none;-webkit-user-select:text;user-select:text}
.field button{border:0;border-left:1px solid var(--line);background:#f1eadc;color:var(--ink);font:inherit;font-size:14px;font-weight:700;padding:0 16px;cursor:pointer}
.field button:disabled,.field input:disabled{opacity:.5}
.toast{min-height:18px;margin-top:8px;text-align:center;font-size:13px;color:var(--lose);font-weight:700}
.dock{padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg);border-top:1px solid var(--line)}
.flip{width:100%;border:0;border-radius:16px;padding:17px;font:inherit;font-size:17px;font-weight:700;color:#f7f1e4;background:var(--ink);cursor:pointer}
.flip:active{background:#34302a}
.flip:disabled{opacity:.5}

#np{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px}
#np div{width:100%;max-width:340px;background:#14161a;color:#fff;border:1px solid #2a2e35;border-radius:18px;padding:22px;font-family:inherit}
#np h3{margin:0 0 14px;font-size:19px}
#np input{width:100%;padding:13px;border-radius:12px;border:1px solid #2a2e35;background:#0c0d10;color:#fff;font:inherit;font-size:17px;outline:none;-webkit-user-select:text;user-select:text}
#np button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#fff;color:#111;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="sk"><small>Streak</small><b id="streak">0</b></div><div class="bl"><small>Balance</small><b id="bal">$100.00</b></div></div>
  <div class="scroll">
    <div class="stage"><div class="hopper" id="hop"><div class="cw" id="cw"><div class="face"><b>H</b></div><div class="face back"><b>T</b></div></div></div><div class="shadow"></div></div>
    <div class="res" id="res"></div>
    <div class="pick" id="pick"><button type="button" data-p="H" class="on"><i>H</i>Heads</button><button type="button" data-p="T"><i>T</i>Tails</button></div>
    <div class="hist" id="hist"></div>
    <div class="lbl"><span>Bet amount</span><span>Pays 1.98x</span></div>
    <div class="field"><span>$</span><input id="bet" type="number" inputmode="decimal" min="1" step="1" value="10"><button id="half" type="button">1/2</button><button id="dbl" type="button">2x</button></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="dock"><button class="flip" id="flip" type="button">Flip</button></div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},KEY='coin_demo_v1',busy=false,bc=null,angle=0,PAY=1.98;
  try{bc=new BroadcastChannel(KEY)}catch(e){}
  var U=(function(){try{return localStorage.getItem('player_name')||''}catch(e){return''}})();
  function askName(force){
    if(document.getElementById('np'))return;
    var o=document.createElement('div');o.id='np';
    o.innerHTML='<div><h3>Enter your name</h3><input id="npi" type="text" maxlength="20" autocomplete="off" placeholder="Your name"><button type="button" id="npb">Continue</button></div>';
    document.body.appendChild(o);
    var i=document.getElementById('npi');if(force&&U)i.value=U;
    function ok(){var v=i.value.replace(/^\s+|\s+$/g,'').slice(0,20);if(!v){i.focus();return}U=v;try{localStorage.setItem('player_name',v)}catch(e){}o.remove();pub()}
    document.getElementById('npb').addEventListener('click',ok);
    i.addEventListener('keydown',function(e){if(e.key==='Enter')ok()});
    setTimeout(function(){i.focus()},50);
  }
  var S={user:'',phase:'idle',balance:100,bet:10,pick:'H',next:[],streak:0,flips:0,hist:[],bser:[],log:[],stats:{wagered:0,wins:0,losses:0,bestStreak:0,bestWin:0},start:100,ts:0};
  try{var sb=parseFloat(localStorage.getItem(KEY+'_bal'));if(sb>=0)S.balance=sb}catch(e){}
  S.start=S.balance;S.bser=[S.balance];
  function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function coin(){var a=new Uint8Array(1);crypto.getRandomValues(a);return a[0]&1?'T':'H'}
  function fill(){while(S.next.length<10)S.next.push(coin())}
  function lg(l,m){S.log.push({t:Date.now(),l:l,m:m});if(S.log.length>150)S.log.shift()}
  function nm(c){return c==='H'?'heads':'tails'}
  var AC=null;
  function tone(a,b,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+.14);g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.18)}catch(e){}}
  function pub(){
    S.ts=Date.now();S.user=U||'Player';
    try{localStorage.setItem(KEY+'_s',JSON.stringify(S))}catch(e){}
    try{if(bc)bc.postMessage(S)}catch(e){}
    if(location.protocol.indexOf('http')===0){try{fetch('/state/coinflip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S),keepalive:true}).catch(function(){})}catch(e){}}
  }
  function ui(){
    $('bal').textContent=fmt(S.balance);$('streak').textContent=S.streak;
    var out=S.balance<1&&!busy;$('flip').textContent=out?'Add $100':'Flip';$('flip').disabled=busy;
    ['bet','half','dbl'].forEach(function(i){$(i).disabled=busy});
    [].forEach.call(document.querySelectorAll('#pick button'),function(b){b.disabled=busy;b.className=b.dataset.p===S.pick?'on':''});
    var h=$('hist');h.innerHTML='';S.hist.slice(0,14).forEach(function(x){var d=document.createElement('div');d.className='dotc'+(x.win?' w':'');d.textContent=x.result;h.appendChild(d)});
  }
  function toast(m){$('toast').textContent=m;if(m)setTimeout(function(){if($('toast').textContent===m)$('toast').textContent=''},2600)}
  function betv(){var v=parseFloat($('bet').value);return isFinite(v)?v:0}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  async function flip(){
    if(busy)return;
    if(S.balance<1){S.balance=100;try{localStorage.setItem(KEY+'_bal',S.balance)}catch(e){}ui();pub();return}
    var b=Math.round(betv()*100)/100;
    if(!(b>=1)){toast('Enter a bet of at least $1');return}
    if(b>S.balance){toast('Not enough balance');return}
    busy=true;S.balance-=b;S.flips++;S.bet=b;S.stats.wagered+=b;S.phase='flipping';
    fill();var res=S.next.shift();S.next.push(coin());
    lg('info','flip '+S.flips+', bet '+fmt(b)+', pick '+nm(S.pick));lg('sys','result '+nm(res));
    $('res').textContent='';$('res').className='res';ui();pub();
    var face=(angle/180)%2===0?'H':'T';angle+=1440+(face===res?0:180);
    var hop=$('hop');hop.classList.remove('hop');void hop.offsetWidth;hop.classList.add('hop');
    $('cw').style.transform='rotateY('+angle+'deg)';tone(500,800,.03);
    await sleep(1350);
    var win=res===S.pick,pay=win?Math.floor(b*PAY*100)/100:0;
    S.balance+=pay;S.bser.push(S.balance);if(S.bser.length>60)S.bser.shift();
    if(win){S.streak++;S.stats.wins++;if(S.streak>S.stats.bestStreak)S.stats.bestStreak=S.streak;if(pay-b>S.stats.bestWin)S.stats.bestWin=pay-b}else{S.streak=0;S.stats.losses++}
    S.hist.unshift({n:S.flips,bet:b,pick:S.pick,result:res,win:win,pay:pay,net:pay-b});if(S.hist.length>20)S.hist.pop();
    lg(win?'ok':'bad',win?'win +'+fmt(pay-b):'loss -'+fmt(b));
    S.phase=win?'won':'lost';busy=false;
    $('res').textContent=win?'You won '+fmt(pay):(res==='H'?'Heads':'Tails')+', you lost';$('res').className='res '+(win?'w':'l');
    tone(win?520:300,win?880:160,.05);
    try{localStorage.setItem(KEY+'_bal',S.balance)}catch(e){}
    ui();pub();
  }
  $('flip').addEventListener('click',flip);
  $('pick').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||busy)return;S.pick=b.dataset.p;ui();pub()});
  $('half').addEventListener('click',function(){$('bet').value=Math.max(1,Math.floor(betv()/2))});
  $('dbl').addEventListener('click',function(){$('bet').value=Math.max(1,Math.min(Math.floor(S.balance),Math.floor(betv()*2)))});
  fill();ui();pub();
(function(){var b=document.getElementById('bal');if(!b)return;var p=b.parentElement;p.style.cursor='pointer';p.addEventListener('click',function(){if(busy)return;var v=prompt('Set your balance',(S.balance).toFixed(2));if(v===null)return;v=parseFloat(String(v).replace(/[^0-9.]/g,''));if(!isFinite(v)||v<0)return;v=Math.round(v*100)/100;S.balance=v;S.start=v;S.bser=[v];try{localStorage.setItem(KEY+'_bal',v)}catch(e){}ui();pub();});})();/*setBalTap*/
  if(!U)askName();
})();
</script>
</body>
</html>
