<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plinko console</title>
<style>
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:var(--thumb2)}::-webkit-scrollbar-corner{background:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#detail{display:none}
body.has-sel #detail{display:grid}
body.has-sel #empty{display:none}
body.home #empty{display:none}
body.home.has-sel #users{display:none}
body:not(.home) #back{display:none}
#detail>.dhead{grid-area:head}#kpis{grid-area:kpis}#hero{grid-area:hero}#charts{grid-area:charts}.logbox{grid-area:log}.histbox{grid-area:hist}.statsbox{grid-area:stats}
.dhead{display:flex;align-items:center;gap:16px}
.dhead h1{margin:0}
.chart{height:var(--ch,160px);min-width:0}.chart svg{width:100%;height:100%;display:block}
.log{height:var(--lh,260px);overflow:auto;font-size:13px;line-height:1.8}
.ln .k{display:inline-block;width:5ch;margin-right:10px}
.ln.info .k{color:var(--acc)}.ln.sys .k{color:var(--dim)}.ln.ok .k{color:var(--win)}.ln.bad .k{color:var(--lose)}.ln.warn .k{color:#d9a400}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}.kv b{font-weight:600}
h4{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--dim)}
.empty,.emptymsg{color:var(--dim);padding:18px 4px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-weight:500;color:var(--dim);text-align:left;padding:2px 8px 9px 0}td{padding:7px 8px 7px 0;border-top:1px solid var(--line)}td.w{color:var(--win)}td.l{color:var(--lose)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555}.dot.on{background:var(--win)}
#charts{display:grid;gap:18px}
.pn{min-width:0}
.us.pl,#ustat.pl{color:var(--win)}


:root{color-scheme:dark;--bg:#0c090e;--panel:#15101a;--line:#2a2030;--text:#f0e4dc;--dim:#8f7d86;--acc:#ff7a45;--win:#ffd166;--lose:#ff4f6d;--thumb:#4a3550;--thumb2:#68496f;--grid:rgba(255,255,255,.07);--font:'Trebuchet MS','Segoe UI',system-ui,sans-serif;--lh:300px}
#top{display:flex;align-items:center;padding:20px 34px;background:#0f0a12;border-bottom:3px solid var(--acc);font-size:24px;font-weight:700;letter-spacing:1px}.grow{flex:1}
#users{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:30px 34px}
.u{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:22px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;position:relative}
.u:hover{border-color:var(--acc)}
.av{width:44px;height:44px;border-radius:12px;background:var(--acc);color:#2a1200;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.un{font-size:21px;font-weight:700}.ub{font-size:24px;color:var(--win);font-weight:700}.us{font-size:12px;color:var(--dim)}.ux{font-size:12px;color:var(--dim)}
main{padding:0}
#detail{padding:26px 34px 50px;grid-template-columns:minmax(500px,1.15fr) 1fr;grid-template-areas:'head head' 'hero kpis' 'hero charts' 'log hist' 'stats stats';gap:20px}
#back{padding:9px 16px;border:1px solid var(--line);border-radius:8px}#back:hover{border-color:var(--acc)}
.dhead h1{font-size:30px}#ustat{color:var(--dim);font-size:13px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
#kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-content:start}
.kpi{background:var(--panel);border-left:4px solid var(--acc);padding:12px 14px;border-radius:6px}.kpi span{display:block;font-size:12px;color:var(--dim)}.kpi b{font-size:22px}
.kpi.hot{background:#2a1710}.kpi.up b{color:var(--win)}.kpi.down b{color:var(--lose)}
#charts{grid-template-columns:1fr}

</style>
</head>
<body>
<div id="app">
<header id="top"><div id="tt"></div><span class="grow"></span><i class="dot" id="dot"></i></header>
<div id="body">
<aside id="users"></aside>
<main>
<div id="empty" class="emptymsg">Select a user</div>
<div id="detail">
<div class="dhead"><button id="back" type="button">&larr; Users</button><h1 id="uname"></h1><span id="ustat"></span></div>
<section id="kpis"></section>
<section id="hero" class="pn"></section>
<section id="charts"></section>
<section class="pn logbox"><h4>Log</h4><div class="log" id="log"></div></section>
<section class="pn histbox"><h4>History</h4><div id="hist"></div></section>
<section class="pn statsbox"><h4>Session</h4><div id="stats"></div></section>
</div>
</main>
</div>
</div>
<script>

var H=(function(){
  function fmt(n){return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function f2(n){return Number(n).toFixed(2)}
  function empty(el){el.innerHTML='<div class="empty" style="padding-top:56px;text-align:center">no data yet</div>'}
  function line(el,data,color){
    var W=520,Ht=170,pl=48,pb=18,pt=8,pr=8;
    if(!data||data.length<2){empty(el);return}
    var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data);if(mx-mn<1e-6){mx=mn+1;mn=mn-1}
    var pad=(mx-mn)*.12;mn-=pad;mx+=pad;
    var iw=W-pl-pr,ih=Ht-pt-pb,pts=data.map(function(v,i){return [pl+i/(data.length-1)*iw,pt+(1-(v-mn)/(mx-mn))*ih]});
    var ln=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
    var area=ln+' L'+pts[pts.length-1][0].toFixed(1)+' '+(Ht-pb)+' L'+pl+' '+(Ht-pb)+' Z';
    var g='';for(var k=0;k<4;k++){var y=pt+k/3*ih,v=mx-k/3*(mx-mn);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--grid)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" style="fill:var(--dim)" font-size="11" text-anchor="end" font-family="monospace">'+Math.round(v)+'</text>'}
    el.innerHTML='<svg viewBox="0 0 '+W+' '+Ht+'" preserveAspectRatio="none">'+g+'<path d="'+area+'" fill="'+color+'" opacity=".12"/><path d="'+ln+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
  }
  function signed(el,vals,pos,neg){
    var W=520,Ht=170,pl=48,pb=18,pt=8,pr=8;
    if(!vals||!vals.length){empty(el);return}
    var m=Math.max.apply(null,vals.map(Math.abs));if(m<1)m=1;
    var iw=W-pl-pr,ih=Ht-pt-pb,zero=pt+ih/2,bw=Math.min(28,iw/vals.length*.7),h='';
    h+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+zero+'" y2="'+zero+'" style="stroke:var(--grid)"/>';
    h+='<text x="'+(pl-6)+'" y="'+(pt+9)+'" style="fill:var(--dim)" font-size="11" text-anchor="end" font-family="monospace">+'+Math.round(m)+'</text><text x="'+(pl-6)+'" y="'+(Ht-pb)+'" style="fill:var(--dim)" font-size="11" text-anchor="end" font-family="monospace">-'+Math.round(m)+'</text>';
    vals.forEach(function(v,i){var x=pl+(i+.5)/vals.length*iw-bw/2,hh=Math.abs(v)/m*(ih/2);h+='<rect x="'+x.toFixed(1)+'" y="'+(v>=0?zero-hh:zero).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,hh).toFixed(1)+'" rx="2" fill="'+(v>=0?pos:neg)+'"/>'});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+Ht+'" preserveAspectRatio="none">'+h+'</svg>';
  }
  /* generic bars: items [{v:0..1 height, c:color}], labels [{f:0..1, t:text}] */
  function bars(el,items,labels){
    var W=520,Ht=170,pl=48,pb=18,pt=8,pr=8;
    if(!items||!items.length){empty(el);return}
    var iw=W-pl-pr,ih=Ht-pt-pb,bw=Math.min(24,iw/items.length*.7),h='';
    (labels||[]).forEach(function(l){var y=pt+ih-l.f*ih;h+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--grid)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" style="fill:var(--dim)" font-size="11" text-anchor="end" font-family="monospace">'+l.t+'</text>'});
    items.forEach(function(it,i){var hh=Math.max(2,it.v*ih),px=pl+(i+.5)/items.length*iw-bw/2;h+='<rect x="'+px.toFixed(1)+'" y="'+(pt+ih-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="2" fill="'+it.c+'" opacity=".92"/>'+(it.tick!=null?'<line x1="'+(px-2).toFixed(1)+'" x2="'+(px+bw+2).toFixed(1)+'" y1="'+(pt+ih-it.tick*ih).toFixed(1)+'" y2="'+(pt+ih-it.tick*ih).toFixed(1)+'" stroke="currentColor" stroke-width="1.5"/>':'')});
    el.innerHTML='<svg viewBox="0 0 '+W+' '+Ht+'" preserveAspectRatio="none">'+h+'</svg>';
  }
  return {fmt:fmt,f2:f2,line:line,signed:signed,bars:bars};
})();

</script>
<script>
function fm(m){return (m>=1000?'1,000':m)+'x'}
function pcol(m){return m>=100?'#ffd84d':m>=10?'#ffab3d':m>=3?'#ff7a45':m>=1?'#d6456f':'#4a2f63'}
function boardSVG(s){
  var ROWS=16,W=520,dx=(W-30)/17,dy=dx*.86,top=26,cx=W/2,Ht=Math.round(top+15*dy+dy*.9+50),h='',i,j,ms=s.mults||[];
  function px(i,j){return cx+(j-(i+2)/2)*dx}
  for(i=0;i<ROWS;i++)for(j=0;j<i+3;j++)h+='<circle cx="'+px(i,j).toFixed(1)+'" cy="'+(top+i*dy).toFixed(1)+'" r="2.8" fill="#6b5a63"/>';
  var ok=s.nextPath&&s.nextPath.length===ROWS;
  if(ok){var pts=[[cx,8]],off=0;for(i=0;i<ROWS;i++){pts.push([cx+off*dx/2,top+i*dy-4]);off+=s.nextPath[i]?1:-1}pts.push([cx+off*dx/2,top+15*dy+dy*.9+14]);
    h+='<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="none" stroke="#ff7a45" stroke-width="2.4" stroke-linejoin="round"/>';
    for(i=1;i<=ROWS;i++)h+='<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+(pts[i][1]+4).toFixed(1)+'" r="4.2" fill="#ffd166"/>';
    h+='<circle cx="'+pts[0][0]+'" cy="'+pts[0][1]+'" r="6" fill="#ff8a3d"/>'}
  var sy=top+15*dy+dy*.9,sw=dx-3;
  for(i=0;i<17;i++){var x=cx+(i-8)*dx-sw/2,on=ok&&s.nextSlot===i,m=ms[i]||1;
    h+='<rect x="'+x.toFixed(1)+'" y="'+sy.toFixed(1)+'" width="'+sw.toFixed(1)+'" height="26" rx="5" fill="'+pcol(m)+'"'+(on?' stroke="#fff" stroke-width="2.5"':' opacity=".85"')+'/><text x="'+(x+sw/2).toFixed(1)+'" y="'+(sy+14).toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" font-family="monospace" fill="'+(m>=3?'#2a1200':'#fff3ea')+'">'+(m>=1000?'1k':m)+'</text>'}
  return '<svg viewBox="0 0 '+W+' '+Ht+'" style="width:100%;height:auto;display:block">'+h+'</svg>';
}
window.CFG={game:'plinko',key:'plinko_demo_v1',store:'plinko_demo_v1_s',layout:'grid',title:'Plinko',
 status:function(s){return s.phase==='dropping'?'playing':'idle'},
 summary:function(s){return (s.drops||0)+' drops'},
 kpis:function(s){var has=s.drops>0,p=(s.balance||0)-(s.start==null?s.balance:s.start);return [['Balance',H.fmt(s.balance)],['Bet',has?H.fmt(s.bet):'-'],['Risk',s.risk||'-'],['Next multiplier',s.nextMult?fm(s.nextMult):'-','hot'],['Next slot',s.nextPath&&s.nextPath.length?(s.nextSlot+1)+' of 17':'-'],['Session profit',has?H.fmt(p):'-',p>0?'up':p<0?'down':'']]},
 hero:function(s,el){el.innerHTML='<h4>Next drop</h4>'+boardSVG(s)},
 charts:[{title:'Balance by drop',draw:function(s,el){H.line(el,s.bser,'#ff7a45')}},{title:'Multipliers, last 30',draw:function(s,el){
   var arr=(s.hist||[]).slice(0,30).reverse();H.bars(el,arr.map(function(x){return {v:(Math.log10(x.mult)+1)/4,c:x.mult>=1?'#ffd166':'#ff4f6d'}}),[0.1,1,10,100,1000].map(function(v,k){return {f:k/4,t:(v>=1000?'1,000':v)+'x'}}));
 }}],
 hist:function(s){var hs=s.hist||[];if(!hs.length)return '<div class="empty">no drops yet</div>';var t='<table><tr><th>drop</th><th>bet</th><th>risk</th><th>slot</th><th>multiplier</th><th>net</th></tr>';hs.forEach(function(x){var c=x.net>0?'w':x.net<0?'l':'';t+='<tr><td>'+x.n+'</td><td>'+H.fmt(x.bet)+'</td><td>'+x.risk+'</td><td>'+x.slot+'</td><td class="'+c+'">'+fm(x.mult)+'</td><td class="'+c+'">'+H.fmt(x.net)+'</td></tr>'});return t+'</table>'},
 stats:function(s){var st=s.stats||{wagered:0,wins:0,losses:0,best:0,bestWin:0},n=st.wins+st.losses;return [['Drops played',n],['Profitable drops',st.wins],['Losing drops',st.losses],['Win rate',n?(st.wins/n*100).toFixed(1)+'%':'-'],['Total wagered',H.fmt(st.wagered)],['Highest multiplier',n?fm(st.best):'-'],['Biggest win',H.fmt(st.bestWin)],['Session profit',H.fmt((s.balance||0)-(s.start==null?s.balance:s.start))]]}
};

</script>
<script>
(function(){
  var C=window.CFG,$=function(i){return document.getElementById(i)},H=window.H,states={},selected=null,built=false;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var HOME=['grid','table','list'].indexOf(C.layout)>-1;
  document.body.classList.add('L-'+C.layout);if(HOME)document.body.classList.add('home');
  $('tt').textContent=C.title;
  function usersView(){
    var names=Object.keys(states).sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1}),h='';
    if(C.layout==='table')h+='<div class="uh"><span>User</span><span>Balance</span><span>Status</span><span>Activity</span></div>';
    if(!names.length)h+='<div class="empty">No users yet. Open the game on a phone and enter a name.</div>';
    names.forEach(function(n){
      var s=states[n],st=C.status(s);
      h+='<button class="u'+(n===selected?' on':'')+'" data-n="'+esc(n)+'"><span class="av">'+esc(n.charAt(0).toUpperCase())+'</span><span class="un">'+esc(n)+'</span><span class="ub">'+H.fmt(s.balance||0)+'</span><span class="us '+(st==='playing'?'pl':'')+'">'+st+'</span><span class="ux">'+esc(C.summary(s))+'</span></button>';
    });
    $('users').innerHTML=h;
  }
  function build(){
    if(built)return;built=true;
    var h='';C.charts.forEach(function(c,i){h+='<div class="pn"><h4>'+c.title+'</h4><div class="chart" id="c'+i+'"></div></div>'});
    $('charts').innerHTML=h;
  }
  function logHTML(lg){if(!lg||!lg.length)return '<div class="empty">no activity yet</div>';var h='';lg.forEach(function(e){h+='<div class="ln '+e.l+'"><span class="k">'+e.l+'</span>'+e.m+'</div>'});return h}
  function detail(){
    var s=states[selected];if(!s)return;build();
    $('uname').textContent=selected;$('ustat').textContent=C.status(s);$('ustat').className=C.status(s)==='playing'?'pl':'';
    var k='';C.kpis(s).forEach(function(x){k+='<div class="kpi '+(x[2]||'')+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'});$('kpis').innerHTML=k;
    C.hero(s,$('hero'));
    C.charts.forEach(function(c,i){c.draw(s,$('c'+i))});
    var L=$('log');L.innerHTML=logHTML(s.log);L.scrollTop=L.scrollHeight;
    $('hist').innerHTML=C.hist(s);
    var r='';C.stats(s).forEach(function(x){r+='<div class="kv"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'});$('stats').innerHTML=r;
  }
  function select(n){selected=n;document.body.classList.add('has-sel');usersView();detail();window.scrollTo(0,0)}
  $('users').addEventListener('click',function(e){var b=e.target.closest('.u');if(b)select(b.dataset.n)});
  $('back').addEventListener('click',function(){selected=null;document.body.classList.remove('has-sel');usersView()});
  function onState(s){
    if(!s||!s.user)return;
    var o=states[s.user];if(o&&o.ts&&s.ts&&s.ts<o.ts)return;
    states[s.user]=s;usersView();if(selected===s.user)detail();
  }
  usersView();
  function connect(){
    if(location.protocol.indexOf('http')!==0)return;
    var es=new EventSource('/events/'+C.game);
    es.onopen=function(){$('dot').className='dot on'};
    es.onmessage=function(e){try{onState(JSON.parse(e.data))}catch(x){console.log(x)}};
    es.onerror=function(){$('dot').className='dot';es.close();setTimeout(connect,1500)};
  }
  connect();
  try{var bc=new BroadcastChannel(C.key);bc.onmessage=function(e){onState(e.data)}}catch(e){}
  window.addEventListener('storage',function(e){if(e.key===C.store){try{onState(JSON.parse(e.newValue))}catch(x){}}});
  try{var sv=JSON.parse(localStorage.getItem(C.store));if(sv)onState(sv)}catch(e){}
})();

</script>
</body>
</html>
